name: Deploy Docs
on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "docs-site/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "ATTRIBUTION.md"
      - "CONTRIBUTING.md"
      - "EVALUATION.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout attacklm-dataset
        uses: actions/checkout@v4
        with:
          repository: Veedubin/attacklm-dataset
          path: _dataset

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install mkdocs mkdocs-material

      - name: Generate docs-site content
        # Call the single source of truth rather than re-implementing its
        # copies inline (the inline mirror had drifted and, missing the
        # mkdir -p, failed every run with "docs-site/docs: No such file or
        # directory"). ATTACKLM_DATASET_DIR points the script at the sibling
        # checkout laid out at _dataset/ in the CI workspace.
        run: bash docs-site/sync-docs.sh
        env:
          ATTACKLM_DATASET_DIR: ${{ github.workspace }}/_dataset

      - name: Build site
        run: cd docs-site && mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
