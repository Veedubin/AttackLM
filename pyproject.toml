# ──────────────────────────────────────────────────────────────────────────────
# AttackLM — pyproject.toml
# ──────────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Project metadata ──────────────────────────────────────────────────────────

[project]
name = "attacklm"
dynamic = ["version"]
description = "QLoRA-fine-tuned Qwen2.5-Coder for offensive/defensive security and AI red-teaming"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Veedubin", email = "noreply@github.com"}]
keywords = [
    "security",
    "red-team",
    "mitre-attack",
    "qlora",
    "fine-tuning",
    "ai-security",
    "offensive-security",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/Veedubin/AttackLM"
Repository = "https://github.com/Veedubin/AttackLM"
Issues = "https://github.com/Veedubin/AttackLM/issues"
Documentation = "https://github.com/Veedubin/AttackLM#readme"

# ── Optional dependency groups ────────────────────────────────────────────────
#
# Two GPU stacks are supported. Pick ONE:
#
#   CUDA stack (NVIDIA) — default. PyTorch ships +cu126/+cu128 wheels;
#                         bitsandbytes has CUDA wheels; flash-attn is available.
#
#   ROCm stack (AMD)    — PyTorch ships +rocm6.0/+rocm6.2 wheels from a
#                         separate index URL; bitsandbytes ROCm wheels are
#                         only on Python 3.10/3.11 (3.12/3.13 needs source
#                         build); flash-attn is NOT available — sdpa fallback.
#
# Convenience meta-groups install the GPU stack + the rest of the deps:
#   pip install attacklm[train-cuda]    ← most common
#   pip install attacklm[train-rocm]    ← AMD GPU
#
# Advanced: install the GPU stack manually with the matching PyTorch index,
# then `pip install attacklm[train]` to fill in everything else:
#   pip install --index-url https://download.pytorch.org/whl/rocm6.2 torch torchvision
#   pip install attacklm[train]

[project.optional-dependencies]
# Lower-level ML libs (no torch — bring your own via [cuda] or [rocm])
train-base = [
    "peft==0.19.1",
    "trl==1.5.1",
    "accelerate==1.14.0",
    "datasets==5.0.0",
    "transformers==5.12.1",
    # ─────────────────────────────────────────────────────────────────────
    # `kernels` package version pin
    # ─────────────────────────────────────────────────────────────────────
    # transformers==5.12.1 declares `kernels<0.14,>=0.12.0` in its
    # [integrations] extras. The heretic-llm CLI pulls `kernels` in
    # transitively, and a fresh `pip install` will otherwise resolve to
    # `kernels>=0.14` (latest as of mid-2026), which breaks:
    #
    #   File ".../transformers/integrations/hub_kernels.py", line 89
    #     "cuda": LayerRepository(
    #         repo_id="kernels-community/deformable-detr",
    #         layer_name="MultiScaleDeformableAttention",
    #     )
    #   ValueError: Either a revision or a version must be specified.
    #
    # This is an upstream API break in `kernels>=0.14` that the
    # `transformers` 5.12.1 integration code passes neither `revision`
    # nor `version` to the newer LayerRepository constructor.
    #
    # WHEN TO REMOVE THIS PIN:
    #   - When transformers 5.13+ is released and the upper bound on
    #     `kernels` is bumped to a compatible range, OR
    #   - When the `transformers` integration code is patched to pass
    #     `revision`/`version` kwargs to LayerRepository.
    #
    # Symptom if you remove this pin prematurely: any code that triggers
    # a `from transformers import ...` will crash with the
    # `LayerRepository` ValueError above. Easy to recognize.
    "kernels>=0.12,<0.14",
    "huggingface-hub==1.18.0",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
]
infer-base = [
    "transformers==5.12.1",
    "peft==0.19.1",
    "huggingface-hub==1.18.0",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
]

# GPU stacks — pick exactly one.
#
# IMPORTANT: ROCm PyTorch wheels are NOT on PyPI. To install the ROCm stack
# you must add PyTorch's index URL:
#
#   pip install --index-url https://download.pytorch.org/whl/rocm6.2 \
#               torch torchvision
#   pip install attacklm[train-base,rocm-base,extract]
#
# The `[train-rocm]` meta-group below assumes you've already added the
# index URL. See README §ROCm install for the full commands.
#
# Both `cuda` and `rocm` use the plain `torch==2.12.0` version pin so the
# metadata is always resolvable on plain PyPI (build CI, dry-runs, etc).
# The `+rocm6.2` suffix would force pip to look on the PyTorch index only,
# which fails when only PyPI is available. Users add the index URL when
# installing for real, which makes pip prefer the ROCm build of torch 2.12.0.
cuda = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "bitsandbytes==0.49.2",  # CUDA wheels shipped on PyPI
]
rocm = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    # bitsandbytes 0.49+ has ROCm wheels for Python 3.10/3.11 only.
    # On 3.12/3.13 you'll need: `pip install bitsandbytes --no-deps`
    # then verify the .so loads on your HIP version.
    "bitsandbytes==0.49.2",
]

# Optional but recommended for newer model architectures (Qwen3-Next, etc.):
# `causal_conv1d` and `flash_linear_attention` are CUDA C++ extensions.
# ROCm users can SKIP these — the Qwen3NextForCausalLM modeling has pure-PyTorch
# fallbacks (slower but works).
#
# IMPORTANT: flash-attn and causal-conv1d need torch at build time but don't
# declare it in their build-system.requires. They are NOT included in [all]
# or [train-cuda] — install them separately AFTER torch is in the environment:
#   uv pip install attacklm[all]
#   uv pip install attacklm[flash-attn]
cuda-extras = []
flash-attn = [
    "flash-attn>=2.7",                # requires CUDA dev tools to build
    "causal-conv1d>=1.4",             # CUDA-only
    "flash-linear-attention>=0.2",    # CUDA-only
]
# ROCm-extras is intentionally empty — ROCm has no flash-attn, and the
# Qwen3-Next modeling has pure-PyTorch fallbacks for causal_conv1d /
# flash_linear_attention. See README §ROCm install for details.
rocm-extras = []

# Convenience meta-groups
train-cuda = ["attacklm[train-base,cuda,cuda-extras]"]
train-rocm = ["attacklm[train-base,rocm,rocm-extras]"]
infer-cuda = ["attacklm[infer-base,cuda]"]
infer-rocm = ["attacklm[infer-base,rocm]"]

# Legacy aliases — keep working so older `pip install attacklm[all]`
# commands don't break. `all` now defaults to the CUDA stack.
train = ["attacklm[train-cuda]"]
infer = ["attacklm[infer-cuda]"]
extract = [
    "pyyaml",
    "requests",
    "gitpython",
]
convert = [
    "gguf",
    "llama-cpp-python",
]
# Unsloth: 2-5x faster training, 70% less VRAM.
# NOT INCLUDED as an extra because it requires trl<=0.24.0 which conflicts
# with our trl==1.5.1. Install in a separate venv:
#   uv venv .venv-unsloth && source .venv-unsloth/bin/activate
#   uv pip install unsloth  # will pull its own trl
#   uv pip install attacklm[train-base,extract,convert]
# Then use: attacklm train --all --use-unsloth ...
# GaLore: Gradient Low-Rank Projection for full-parameter fine-tuning.
# Enables full-parameter learning on consumer GPUs by projecting
# gradients into a low-rank space during optimization.
# Mutually exclusive with Unsloth and QLoRA — GaLore trains ALL parameters.
# Install: uv pip install attacklm[galore]
# Then use: attacklm train --all --use-galore ...
galore = [
    "galore-torch>=1.0",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "ipython",
    "scipy>=1.11",  # needed for eval tests (Spearman correlation)
]
eval = [
    "scipy>=1.11",  # for Spearman correlation in golden_vectors.py
]
# `all` defaults to CUDA. ROCm users should use `[all-rocm]` (see README).
# We do NOT include all-rocm in `all` because the `torch==2.12.0+rocm6.2`
# pin is unsatisfiable on plain PyPI — it requires the PyTorch index URL
# at install time. Resolving `attacklm[all]` on a build/CI server without
# that index URL would fail.
all = [
    "attacklm[train-cuda,extract,convert,dev]",
]
all-cuda = ["attacklm[train-cuda,extract,convert]"]
all-rocm = ["attacklm[train-rocm,extract,convert]"]

# ── Console script entry points ───────────────────────────────────────────────
#
# v0.8.0+: The unified ``attacklm`` command (subcommand-based) is the primary
# interface.  The old hyphenated commands are DEPRECATED but kept for one
# release cycle.  They print a deprecation warning and delegate to the new
# subcommand.  They will be removed in v0.9.0.

[project.scripts]
# New unified CLI
attacklm = "attacklm.cli:main"

# Deprecated (v0.8.x) — to be removed in v0.9.0
attacklm-train = "attacklm.cli:main_train"
attacklm-train-all = "attacklm.cli:main_train_all"
attacklm-hpo = "attacklm.cli:main_hpo"
attacklm-infer = "attacklm.cli:main_infer"
attacklm-merge = "attacklm.cli:main_merge"
attacklm-gguf = "attacklm.cli:main_gguf"
attacklm-demo = "attacklm.cli:main_demo"
attacklm-extract = "attacklm.cli:main_extract"
attacklm-buckets = "attacklm.cli:main_buckets"
attacklm-attribute = "attacklm.cli:main_attribute"
attacklm-clone = "attacklm.cli:main_clone"
attacklm-init = "attacklm.cli:main_init"
attacklm-balance = "attacklm.cli:main_balance"
attacklm-build = "attacklm.cli:main_build"
attacklm-train-lora = "attacklm.cli:main_train_lora"
attacklm-eval = "attacklm.cli:main_eval"
attacklm-collect-ref = "attacklm.cli:main_collect_ref"
attacklm-score = "attacklm.cli:main_score"
attacklm-compare = "attacklm.cli:main_compare"
attacklm-golden = "attacklm.cli:main_golden"
attacklm-pipeline = "attacklm.scripts.pipeline:main"

# ── Hatch build configuration ─────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/attacklm"]

# Include scripts/ in the wheel so CLI entry points can find them.
# Without this, `attacklm-train-all` etc. fail with "script not found"
# because _SCRIPTS_DIR resolves to site-packages/scripts/ which is empty.
# scripts/ is ~200KB of Python — negligible for the wheel.
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "attacklm/scripts"

[tool.hatch.version]
path = "src/attacklm/__version__.py"

# ── Build-time dependencies for packages that don't declare them ────────────────
# flash-attn and causal-conv1d need torch at build time but don't list it in
# their build-system.requires. Without this, `uv pip install attacklm[all]` fails
# with "ModuleNotFoundError: No module named 'torch'" during the flash-attn build.
# This tells uv to pre-install torch before building these packages.
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
causal-conv1d = ["torch"]